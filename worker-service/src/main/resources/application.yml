server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: worker-service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  ai:
    openai:
      api-key: ${GROQ_API_KEY:placeholder}
      base-url: https://api.groq.com/openai/v1
      audio:
        transcription:
          response-format: json
          model: whisper-large-v3

app:
  ai:
    text-provider: ${TEXT_AI_PROVIDER:gemini}   # groq | gemini
    groq:
      api-key: ${GROQ_API_KEY:placeholder}
      base-url: https://api.groq.com/openai/v1
      chat-model: openai/gpt-oss-20b
    gemini:
      api-key: ${GEMINI_API_KEY:placeholder}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat-model: gemini-3.6-flash

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:placeholder}
    secret-key: ${MINIO_SECRET_KEY:placeholder}

  kafka:
    topics:
      audio-uploaded: audio-uploaded
      audio-processing-result: audio-processing-results

  audio-compression:
    max-output-size-bytes: 25000000
    target-sample-rate-hz: 16000
    min-bitrate-kbps: 16
    max-bitrate-kbps: 64
    bitrate-safety-factor: 0.9

  audio-processing:
    max-question-extraction-tokens: 7000

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO