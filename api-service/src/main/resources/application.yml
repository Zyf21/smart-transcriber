server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/transcriber_db}
    username: ${SPRING_DATASOURCE_USERNAME:db_user}
    password: ${SPRING_DATASOURCE_PASSWORD:placeholder}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:placeholder}
    secret-key: ${MINIO_SECRET_KEY:placeholder}
    bucket-raw: raw-audio

  upload:
    max-file-size-bytes: 157286400
    allowed-content-types:
      - audio/mpeg
      - audio/wav
      - audio/x-wav
      - audio/mp4
      - audio/x-m4a
      - audio/aac
      - audio/x-aac
      - audio/ogg
      - audio/webm
    allowed-extensions:
      - mp3
      - wav
      - m4a
      - aac
      - ogg
    stale-pending-threshold-minutes: 15
    cleanup-interval-ms: 300000

  kafka:
    topics:
      audio-uploaded: audio-uploaded
      audio-processing-result: audio-processing-results

  outbox:
    publish-interval-ms: 5000

  cache:
    audio-upload-ttl-hours: 24

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO